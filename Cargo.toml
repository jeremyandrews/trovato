[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/mcp-server",
    "crates/plugin-sdk",
    "crates/plugin-sdk-macros",
    "crates/test-utils",
    "crates/search-index",
    "benchmarks/phase0",
    "benchmarks/load-test",
    "benchmarks/field-queries",
    "plugins/trovato_blog",
    "plugins/trovato_media",
    "plugins/trovato_redirects",
    "plugins/trovato_audit_log",
    "plugins/trovato_scheduled_publishing",
    "plugins/trovato_content_locking",
    "plugins/trovato_webhooks",
    "plugins/trovato_image_styles",
    "plugins/trovato_oauth2",
    "plugins/trovato_categories",
    "plugins/trovato_comments",
    "plugins/trovato_locale",
    "plugins/trovato_content_translation",
    "plugins/trovato_config_translation",
    "plugins/trovato_block_editor",
    "plugins/trovato_search",
    "plugins/trovato_spam",
    "plugins/trovato_ai",
    "plugins/goose",
"plugins/trovato_seo",
    "plugins/trovato_page_builder",
    "plugins/trovato_captcha",
    "plugins/test_plugin_api",
    "plugins/test_form_taps",
    "plugins/test_form_taps_b",
    # 0.102 AI Assistant e2e fixture: declares an assistant scope with a read
    # tool, a write tool and a failing tool, plus a deliberately invalid scope
    # so the registry's drop-and-warn path is exercised by a real plugin.
    # Built with --target wasm32-wasip1 like the other plugin cdylibs.
    "plugins/test_assistant_scope",
    "plugins/trovato_series",
    # Book-style page trees: ordered hierarchy with prev/next/up navigation.
    # Built with --target wasm32-wasip1 like the other plugin cdylibs.
    "plugins/trovato_book",
    # A contact form: the first plugin to use the mail interface, the `_token`
    # form field and themed plugin pages, all added at 0.101.
    "plugins/trovato_contact",
    # Epic 2 (Story 2.4) plugin-to-plugin invocation e2e test fixtures. Built with
    # --target wasm32-wasip1 (like the other plugin cdylibs); not default-members.
    "plugins/test_e2e_caller",
    "plugins/test_e2e_callee",
    "plugins/test_e2e_bystander",
    "plugins/test_e2e_nocaps",
    # P11c (D-40/D-41) background-AI principal e2e fixture: calls ai_request from
    # tap_cron; built with --target wasm32-wasip1 like the other plugin cdylibs.
    "plugins/test_ai_background",
    # P11d (D-45..D-48) plugin-queue-v2 e2e fixture: tap_queue_worker that can
    # trap, tap_queue_info declaring concurrency, tap_cron exercising `enqueue`;
    # built with --target wasm32-wasip1 like the other plugin cdylibs.
    "plugins/test_queue_worker",
    # B68 item-write fixture: records the item write taps it receives, rewrites
    # an item from tap_item_update (the re-entrancy bound) and drives the
    # item-api SDK bindings; built with --target wasm32-wasip1.
    "plugins/test_item_writer",
    "plugins/test_item_deny",
    # U40 background item-api fixture: save-item and delete-item from tap_cron
    # and tap_queue_worker under item_background; built with --target wasm32-wasip1.
    "plugins/test_item_background",
    # B218 search index fixture: a raw item write from tap_cron, then the
    # search-index-enqueue host call plugins use to say so; built with
    # --target wasm32-wasip1.
    "plugins/test_search_enqueue",
    # B80 site fixture: a site plugin's listings, sitemap, docs and translation
    # sync through `query` and item-api, with no raw_sql; built with
    # --target wasm32-wasip1.
    "plugins/test_site_queries",
    # B73 member fixture: reads about the site's members by id through
    # user-api.load-users; built with --target wasm32-wasip1.
    "plugins/test_members",
    # B74 navigation fixture: account menu entries with a parent, one gated,
    # one per viewer, one unfollowable; built with --target wasm32-wasip1.
    "plugins/test_menu_entries",
    # A13 page builder fixture: ships two page builder components (files, no
    # code) and a landing page type to compose them on; built with
    # --target wasm32-wasip1.
    "plugins/test_page_builder_components",
    # FR-8 (Story 3.8) reference plugin: the canonical tap_field_access
    # implementation (Cairn tier + Ritrovo role patterns). Real, enableable
    # plugin; built with --target wasm32-wasip1 like the other plugin cdylibs.
    "plugins/trovato_field_access_ref",
    # FR-7c (Story 4.5) recovery-tap freeze-gate fixtures: the canonical
    # tap_account_recovery reference (owner of trovato_recovery_ref:code) and a
    # rogue bystander that forges Verified (owner-scoped fold must ignore it);
    # built with --target wasm32-wasip1 like the other plugin cdylibs.
    "plugins/trovato_recovery_ref",
    "plugins/test_recovery_bystander",
    # P11g (D-59) lightweight-record freeze-gate fixture: declares the
    # `event_record` record type and governs it with tap_field_access, exercised
    # through real gather + the real FR-8 seam; built with --target wasm32-wasip1.
    "plugins/trovato_record_ref",
    # B108 owned-vocabulary fixture: clubs own vocabularies, created through
    # the `vocabulary` host interface and administered by the club's managers
    # through tap_vocabulary_owner_access; built with --target wasm32-wasip1.
    "plugins/test_owned_vocabulary",
]
# B216 dev tool: decodes Pagefind indexes and proves per page tokenizing
# matches a full CLI build. Its own workspace and lockfile, not a member: the
# `pagefind` crate it pins (=1.3.0) carries actix-web for `pagefind --serve`,
# and with it RUSTSEC-2026-0443 (actix-files) and RUSTSEC-2026-0258 (h2 0.3),
# which have no fix inside pagefind 1.3.0's version ranges. Kept out of this
# lockfile, they never reach the shipped dependency graph or its audit.
exclude = ["crates/pagefind-harness"]
# Guest WASM crate must be built separately with --target wasm32-wasip1
# Plugin cdylibs (goose) excluded — build with --target wasm32-wasip1
default-members = [
    "crates/kernel",
    "crates/mcp-server",
    "crates/plugin-sdk",
    "crates/plugin-sdk-macros",
    "crates/test-utils",
    "crates/search-index",
    "benchmarks/phase0",
    "benchmarks/load-test",
    "benchmarks/field-queries",
    "plugins/trovato_blog",
]

[workspace.package]
# The single version string for the whole project. Every in-tree crate inherits
# it with `version.workspace = true`, and the plugin manifests, the plugin API
# tuple (KERNEL_API_VERSION) and the Docker tags all move with it in lock-step.
# See docs/design/Versioning.md and docs/design/version-map.md.
version = "0.106.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jeremiah Andrews"]
repository = "https://github.com/jeremyandrews/trovato"
homepage = "https://github.com/jeremyandrews/trovato"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "compression-gzip", "cors"] }
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16"
fred = { version = "10", features = ["subscriber-client"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
sea-query = { version = "0.32", features = ["backend-postgres", "with-uuid"] }
wasmtime = "49"
argon2 = "0.5"
# FR-7a (D-34): the WebAuthn/passkey ceremony implementation. `danger-allow-state-
# serialisation` is required to hold the in-flight PasskeyRegistration /
# PasskeyAuthentication in the Redis-backed session (design §1: no new challenge
# store). `danger-credential-internals` is required to read the denormalized
# lookup/display columns (counter, backup flags, AAGUID) that D-35 puts alongside
# the authoritative serialized `Passkey` blob. Both are read-only escapes; neither
# weakens verification, which stays entirely inside the library.
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
    "danger-credential-internals",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "=0.0.12"
toml = "0.8"
moka = { version = "0.12", features = ["future", "sync"] }
redis = { version = "0.27", features = ["tokio-comp", "cluster-async"] }
dashmap = "6"
tera = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
# Admin dates in the viewer's timezone (B246); the version already in Cargo.lock.
chrono-tz = "0.9"
# Natural order for in-memory admin listings (B246); the version already in Cargo.lock.
deunicode = "1.6"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"
dotenvy = "0.15"
hex = "0.4"
infer = "0.19"
rand = "0.8"
regex = "1"
# PostgreSQL-dialect SQL parser, for the raw-SQL guard on the `db` host
# functions. The `visitor` feature is what lets the guard walk a parsed
# statement for relations and function calls rather than re-matching its text.
sqlparser = { version = "0.63", features = ["visitor"] }
sha2 = "0.10"
hostname = "0.4"
async-trait = "0.1"
urlencoding = "2"
prometheus-client = "0.22"
clap = { version = "4", features = ["derive"] }
image = "0.25"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "stream"] }
hmac = "0.12"
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2"
base64 = "0.22"
url = "2"
ammonia = "4"
syntect = "5"
parking_lot = "0.12"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3"
futures-core = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "pool"] }
# Word and line diffs for the revision compare page. Default features (`std`,
# `text`) pull in no other crate.
similar = "3.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# The following are already covered by `all` but listed explicitly so they
# remain visible as project-level expectations and survive any future change
# to the `all` group.
manual_let_else = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"

# The dependencies the tests spend their CPU in, optimized even in debug and
# test builds: argon2, which hashes a password for every user a test creates
# and every login, and Cranelift, which compiles the in-tree plugins whenever a
# `TestApp` starts. Unoptimized, integration_test takes 18 CPU-seconds and
# session_management_test 9.5; with these, 5.5 and 4.1 (measured locally,
# 2026-11-24). A debug `cargo run` starts faster too.
#
# Only these packages, not `"*"`: every dependency optimized cut those two to
# 3.3 and 2.7, but tripled a cold dependency build in CI (5.6 to 16.5 minutes,
# runs 45406677098 and 45412845837), and a cold cache is common enough there
# to matter. The kernel and the plugins build, and step in a debugger, exactly
# as before.
#
# Tera and pest, its parser, belong on the list too: every `TestApp` and every
# CLI command parses all the templates at start, and since the admin passes
# its words through `t()` that parse is most of a debug start (ThemeEngine::new
# 1.29 s unoptimized, 0.29 s with these, measured locally 2026-11-25).
[profile.dev.package.tera]
opt-level = 3
[profile.dev.package.pest]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-internal-core]
opt-level = 3
[profile.dev.package.pulley-interpreter]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.base64ct]
opt-level = 3
# The search index (B218): tokenizing (the vendored fossick over lol_html), CBOR,
# gzip and SHA-1 run for every page the index and gate tests build. Unoptimized
# they took the crate's random update proof to 72 s on CI; optimized, 11 s
# locally with every batch compared to a full build.
[profile.dev.package.trovato-search-index]
opt-level = 3
[profile.dev.package.lol_html]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.minicbor]
opt-level = 3
[profile.dev.package.pagefind_stem]
opt-level = 3
