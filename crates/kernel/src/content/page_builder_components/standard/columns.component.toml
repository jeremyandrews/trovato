# Columns: two to four side by side drop zones.
type = "Columns"
label = "Columns"
category = "layout"
description = "Two to four columns, each a drop zone for other components."
zones = ["zone-0", "zone-1", "zone-2", "zone-3"]
classes = ["pb-columns--gap-none", "pb-columns--gap-small", "pb-columns--gap-large"]

[[fields]]
name = "layout"
type = "select"
default = "1/2+1/2"
options = [
  { value = "1/2+1/2", label = "50/50" },
  { value = "2/3+1/3", label = "2/3 + 1/3" },
  { value = "1/3+2/3", label = "1/3 + 2/3" },
  { value = "1/3+1/3+1/3", label = "Thirds" },
  { value = "1/4+1/4+1/4+1/4", label = "Quarters" },
]

[[fields]]
name = "gapSize"
type = "select"
label = "Gap"
default = "default"
options = [
  { value = "default", label = "Default" },
  { value = "none", label = "None", class = "pb-columns--gap-none" },
  { value = "small", label = "Small", class = "pb-columns--gap-small" },
  { value = "large", label = "Large", class = "pb-columns--gap-large" },
]

# Before 0.105 the gap was a free CSS value written into a style attribute.
[[fields]]
name = "gap"
type = "text"
hidden = true
deprecated = "Replaced by gapSize; the value is no longer written into the page."
