<div class="form-item form-item--file">
    
    <label for="document" class="form-item__label">Document</label>
    
    
    <div class="file-upload-widget" data-field="document">
        <input type="hidden" id="document" name="document" value="0193-file">
        <div class="file-upload-widget__preview">
            <span class="file-upload-widget__filename">File attached</span>
            <button type="button" class="button button--small file-upload-widget__remove">Remove</button>
        </div>
        <div class="file-upload-widget__input" style="display:none">
            <input type="file" class="file-upload-widget__file" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.zip,.gz">
            <button type="button" class="button button--small media-picker-browse" data-target="document">Browse media</button>
            <span class="file-upload-widget__status"></span>
        </div>
        <p class="form-item__description">Max 10 MB. Allowed: images, PDFs, documents, archives.</p>
    </div>
    
</div>
