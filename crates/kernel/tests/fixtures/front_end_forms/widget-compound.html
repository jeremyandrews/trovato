<div class="form-item form-item--compound">
    
    <label class="form-item__label">Sections</label>
    
    <div class="compound-field" id="compound-sections" data-field="sections"
         data-config="{}"
         data-section-types="[]">
        <div class="compound-field__sections"></div>
        <input type="hidden" name="sections" class="compound-field__value" value="[]">
        <div class="compound-field__actions">
            <button type="button" class="button compound-field__add">Add section</button>
        </div>
    </div>
    
</div>
