{% import "pb/macros.html" as a11y %}
<section class="pb-section pb-section--pad-{{ padding | default(value='default') }} pb-section--width-{{ maxWidth | default(value='default') }}{% if variant_classes %} {{ variant_classes }}{% endif %}"
  {{- a11y::aria_label(label=ariaLabel | default(value="")) }}
  {{- a11y::lang_attr(lang=lang | default(value="")) }}
  {# A background is a declared variant class (variant_classes), never a style attribute. #}>
  {% if zones and zones.content %}
    {% for child_html in zones.content %}{{ child_html | safe }}{% endfor %}
  {% endif %}
</section>
