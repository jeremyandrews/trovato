<div class="form-actions">
    <button
        type="submit"
        id="{{ name }}"
        name="{{ name }}"
        class="form-submit button {% if element.attributes and element.attributes.class %}{{ element.attributes.class }}{% else %}button--primary{% endif %}"
        {% if element.disabled %}disabled{% endif %}
        {% if element.attributes %}{% for key, value in element.attributes %}{% if key != "class" %} {{ key }}="{{ value }}"{% endif %}{% endfor %}{% endif %}
    >
        {{ element.value | default(value="Submit") }}
    </button>
    {% if element.suffix %}{{ element.suffix | safe }}{% endif %} {# SAFE: kernel FormBuilder-generated HTML — prefix/suffix are kernel-controlled strings #}
</div>
