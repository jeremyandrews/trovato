<div class="form-item form-item--blocks">
    {% if element.title %}
    <label class="form-item__label{% if element.required %} form-item__label--required{% endif %}">{{ element.title }}</label>
    {% endif %}
    <input type="hidden" id="{{ name }}" name="{{ name }}" value="{{ element.default_value | default(value='[]') }}"{% if element.disabled %} disabled{% endif %}>
    <div data-block-editor data-block-editor-input="{{ name }}"></div>
    {% if field_error %}<div id="error-{{ name }}" class="form-item__error" role="alert">{{ field_error }}</div>{% endif %}
    {% if element.description %}<p class="form-item__description">{{ element.description }}</p>{% endif %}
</div>
