<article class="item item--blog">
    <header class="item__header">
        <h1 class="item__title">{{ item.title }}</h1>
        <div class="item__meta">
            {% if item.created %}
            <time class="item__date">{{ item.created | format_date }}</time>
            {% endif %}
            {% if view_count %}
            <span class="item__reads statistics-counter">{{ view_count }} read{% if view_count != 1 %}s{% endif %}</span>
            {% endif %}
        </div>
    </header>

    <div class="item__content">
        {{ children | safe }} {# SAFE: kernel render pipeline output — child elements already rendered and sanitized #}
    </div>
</article>
