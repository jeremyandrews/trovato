# Editor role — can create, edit and review conference content.
#
# `config import` applies the role itself. It does not apply permissions: the
# `role` config entity carries id, name and created, and nothing else. The
# permissions this role is meant to hold are:
#   - access content
#   - create content
#   - edit own content
#   - edit any content
#   - access files
#   - use filtered_html
#   - view incoming conferences   (declared by ritrovo_access, Part 5)
#   - view curated conferences    (declared by ritrovo_access, Part 5)
#   - edit conferences            (declared by ritrovo_access, Part 5)
# Assign them at /admin/people/permissions, or with the SQL in
# docs/tutorial/recipes/recipe-part-04.md.
