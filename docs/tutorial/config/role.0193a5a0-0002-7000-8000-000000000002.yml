# Editor role — can create, edit and review conference content.
#
# `config import` applies these permissions, replacing whatever the role holds:
# the file is authoritative, so removing a line here revokes that permission on
# the next import.
#
# Three permissions this role is meant to hold are NOT listed, and cannot be:
#   - view incoming conferences   (declared by ritrovo_access, Part 5)
#   - view curated conferences    (declared by ritrovo_access, Part 5)
#   - edit conferences            (declared by ritrovo_access, Part 5)
# See the viewer role's file for why a plugin's permissions cannot be listed
# until the plugin has granted them once.
id: 0193a5a0-0002-7000-8000-000000000002
name: editor
created: "2026-01-01T00:00:00Z"
permissions:
- access content
- create content
- edit own content
- edit any content
- access files
- use filtered_html
