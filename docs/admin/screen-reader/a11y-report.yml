- main:
  - navigation "Breadcrumb":
    - list:
      - listitem:
        - link "Administration":
          - /url: /admin
      - listitem:
        - link "Reports":
          - /url: /admin/reports/overview
      - listitem: Accessibility
  - heading "Accessibility" [level=1]
  - paragraph: Images that lack a text alternative, and how this administration is checked.
  - region "Images without a text alternative":
    - heading "Images without a text alternative" [level=2]
    - paragraph: Every image has a text alternative.
  - region "In content":
    - heading "In content" [level=2]
    - paragraph: No content has an image without a text alternative.
  - region "Your settings":
    - heading "Your settings" [level=2]
    - list:
      - listitem: "Colour theme: follows your device."
      - listitem: The / key opens search.
      - listitem: No other key opens search.
    - paragraph:
      - link "Change them in Your preferences":
        - /url: /admin/preferences
  - region "How this administration is checked":
    - heading "How this administration is checked" [level=2]
    - paragraph: "The administration aims at WCAG 2.2 level AA. Each change to Trovato is checked by:"
    - list:
      - listitem: axe-core on every administration page, in light and dark themes, at 320 pixels wide and right to left;
      - listitem: "keyboard checks: the skip link, the sidebar, forms, listings, the confirmation page and search;"
      - listitem: the colour contrast of every pair of theme colours, in both themes;
      - listitem: the accessibility tree of each kind of page, as a screen reader is given it;
      - listitem: a test that finds interface text left untranslated.
    - paragraph: What is not done yet is listed in docs/admin/accessibility.md, with these checks.
  - paragraph:
    - link "Who can do this?":
      - /url: /admin/people/who-can?path=/admin/reports/accessibility
