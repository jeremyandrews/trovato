- main:
  - heading "Dashboard" [level=1]
  - paragraph: What needs your attention, and a way into every area you may use.
  - region "Your recent content":
    - heading "Your recent content" [level=2]
    - paragraph: You have not written anything yet.
  - region "Waiting for you":
    - heading "Waiting for you" [level=2]
    - paragraph: Nothing is waiting for you.
    - list:
      - listitem:
        - link "0 drafts to review":
          - /url: /admin/content/moderated?state=draft
      - listitem:
        - link "0 comments waiting for moderation":
          - /url: /admin/content/comments?status=2
          - paragraph: 0 comments waiting for moderation
  - region "Scheduled tasks":
    - heading "Scheduled tasks" [level=2]
    - paragraph: Scheduled tasks are working.
    - list:
      - listitem:
        - link "Cron has not run yet.":
          - /url: /admin/reports/cron
      - listitem: 0 queued jobs stopped after failing repeatedly
