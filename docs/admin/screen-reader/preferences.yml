- main:
  - navigation "Breadcrumb":
    - list:
      - listitem:
        - link "Administration":
          - /url: /admin
      - listitem: Your admin preferences
  - heading "Your admin preferences" [level=1]
  - paragraph: The colour theme and language this administration uses for you.
  - group "Colour theme":
    - text: Colour theme
    - paragraph: System follows your device's light or dark setting.
    - radio "System" [checked]
    - text: System
    - radio "Light"
    - text: Light
    - radio "Dark"
    - text: Dark
  - text: Administration language
  - paragraph: The language these pages are shown in. It does not change the language of your content.
  - combobox "Administration language":
    - option "English" [selected]
    - option "Pseudo (accented, longer)"
    - option "Pseudo (right to left)"
  - group "Search shortcuts":
    - text: Search shortcuts
    - checkbox "Open search with /" [checked]
    - text: Open search with /
    - paragraph: Pressing / anywhere outside a text field opens search. Turn it off if it gets in the way of your screen reader or other keys.
    - text: Another key to open search
    - paragraph: Works in text fields too. Control+K replaces the browser's own use of that key on these pages.
    - combobox "Another key to open search":
      - option "None" [selected]
      - option "Control+K (Command+K on a Mac)"
      - option "Alt+K (Option+K on a Mac)"
  - paragraph:
    - strong: "What this changes:"
    - text: only how this administration looks and reads for you. Nobody else is affected.
  - button "Save preferences"
  - region "Sign out":
    - heading "Sign out" [level=2]
    - button "Log out"
  - paragraph:
    - link "Who can do this?":
      - /url: /admin/people/who-can?path=/admin/preferences
