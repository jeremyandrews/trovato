        - link "Content types":
          - /url: /admin/structure/types
        - paragraph: Administration › Structure
        - paragraph: The kinds of content the site holds, and the fields each one has.
      - listitem:
        - link "Comments":
          - /url: /admin/content/comments
        - paragraph: Administration › Content
        - paragraph: Approve, edit and remove comments, and set how new ones are published.
      - listitem:
        - link "Files":
          - /url: /admin/content/files
        - paragraph: Administration › Content
        - paragraph: Every uploaded file, with its details and alternative text.
      - listitem:
        - link "Media":
