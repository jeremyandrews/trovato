- main:
  - navigation "Breadcrumb":
    - list:
      - listitem:
        - link "Administration":
          - /url: /admin
      - listitem:
        - link "People":
          - /url: /admin/people/overview
      - listitem: Add user
  - heading "Add user" [level=1]
  - paragraph: Create an account and choose its roles.
  - text: Username (required)
  - paragraph: The unique username for this account.
  - textbox "Username (required)"
  - text: Email (required)
  - paragraph: A valid email address for this user.
  - textbox "Email (required)"
  - text: Password (required)
  - paragraph: Minimum 12 characters.
  - textbox "Password (required)"
  - group "Status and permissions":
    - text: Status and permissions
    - checkbox "Active"
    - text: Active
    - paragraph: Blocked users cannot log in.
    - checkbox "Administrator"
    - text: Administrator
    - paragraph: Administrators have full access to the site. Only an administrator can grant or remove this.
    - checkbox "Notify user of new account"
    - text: Notify user of new account
    - paragraph: Mails the new user a welcome message with a one-time link to sign in and choose their own password.
  - group "Roles":
    - text: Roles
    - paragraph: A role grants its permissions to every user who holds it.
    - paragraph:
      - link "See the permissions":
        - /url: /admin/people/permissions
    - checkbox "anonymous user"
    - text: anonymous user
    - checkbox "authenticated user"
    - text: authenticated user
    - checkbox "category_admin"
    - text: category_admin
    - checkbox "comment_moderator"
    - text: comment_moderator
    - checkbox "media_admin"
    - text: media_admin
    - checkbox "oauth_admin"
    - text: oauth_admin
    - checkbox "redirect_admin"
    - text: redirect_admin
  - button "Create user"
  - link "Cancel":
    - /url: /admin/people
  - paragraph:
    - link "Who can do this?":
      - /url: /admin/people/who-can?path=/admin/people/add
