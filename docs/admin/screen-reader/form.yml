- main:
  - navigation "Breadcrumb":
    - list:
      - listitem:
        - link "Administration":
          - /url: /admin
      - listitem:
        - link "Configuration":
          - /url: /admin/config/overview
      - listitem:
        - link "Stages":
          - /url: /admin/structure/stages
      - listitem: Add stage
  - heading "Add stage" [level=1]
  - paragraph: A stage is a step content passes through on its way to being published.
  - text: Machine name (required)
  - paragraph: Lowercase letters, numbers and underscores, starting with a letter. This is what config files and workflow definitions refer to the stage by.
  - textbox "Machine name (required)"
  - text: Label (required)
  - textbox "Label (required)"
  - text: Description
  - paragraph: Optional. Shown to editors in the stage listing.
  - textbox "Description"
  - text: Visibility (required)
  - paragraph: Only one stage can be public, and it is the Live stage.
  - combobox "Visibility (required)":
    - option "Internal — visible to editors with stage access" [selected]
    - option "Public — visible to every visitor"
    - option "Accessible — reachable by direct URL, absent from listings"
  - checkbox "Default stage for new content"
  - text: Default stage for new content
  - paragraph: "Exactly one stage is the default. Checking this here clears it on whichever stage holds it now. It cannot be cleared without giving it to another stage: new content has to land somewhere."
  - text: Weight
  - paragraph: Lower sorts first in the listing.
  - spinbutton "Weight": "0"
  - button "Create stage"
  - link "Cancel":
    - /url: /admin/structure/stages
  - paragraph:
    - link "Who can do this?":
      - /url: /admin/people/who-can?path=/admin/structure/stages/add
