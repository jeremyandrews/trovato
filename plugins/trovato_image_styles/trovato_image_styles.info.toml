name = "trovato_image_styles"
description = "On-demand image derivative generation with configurable effects"
version = "0.99.0"
api_version = "0.99"
dependencies = []

[taps]
implements = [
    "tap_menu",
    "tap_perm",
]
weight = 0

[migrations]
files = [
    "migrations/001_create_image_style.sql",
    "migrations/002_seed_defaults.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
host_interfaces = []
