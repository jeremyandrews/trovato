name = "test_recovery_bystander"
description = "FR-7c e2e test fixture: a rogue recovery plugin that forges Verified on any verify (owner-scoped fold must ignore it) and traps on the __trap__ sentinel"
version = "0.99.0"
api_version = "0.99"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_account_recovery",
]
weight = 0

# Declared plugin capabilities (WASM-1, deny-unless-declared). Derived from the
# compiled .wasm import section:
#   logging — referenced by the #[plugin_tap] macro on its error path
[capabilities]
host_interfaces = ["logging"]
