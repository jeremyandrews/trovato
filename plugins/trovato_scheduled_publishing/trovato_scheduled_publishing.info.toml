name = "trovato_scheduled_publishing"
description = "Schedule items for future publish and unpublish"
version = "0.105.0"
api_version = "0.105"
dependencies = []

[taps]
implements = [
    "tap_menu",
    "tap_perm",
    "tap_cron",
]
weight = 0

[migrations]
files = [
    "migrations/001_gather_queries.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
# `db` for the read that finds what is due (query-raw) and the statement that
# claims each item by removing its date (execute-raw), `item-api` for the
# status change: an item service update, so the item write taps fire, a
# revision is recorded and the item is queued for the search index, as for an
# editor's save. From cron that needs `item_background`.
host_interfaces = ["db", "logging", "item-api"]
raw_sql = true
item_background = true
