name = "trovato_scheduled_publishing"
description = "Schedule items for future publish and unpublish"
version = "0.106.0"
api_version = "0.106"
dependencies = []

[taps]
implements = [
    "tap_menu",
    "tap_perm",
    "tap_cron",
    "tap_item_insert",
    "tap_item_update",
    "tap_item_delete",
    "tap_timer",
    "tap_form_alter",
    "tap_form_validate",
    "tap_form_submit",
]
weight = 0

[migrations]
files = [
    "migrations/001_gather_queries.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
# `db` for the read that finds what is due (query-raw) and the statement that
# claims each item by removing its date (execute-raw), `item-api` for the
# status change: an item service update, so the item write taps fire, a
# revision is recorded and the item is queued for the search index, as for an
# editor's save. From cron and from a timer that needs `item_background`.
# `timer` for the precise timer each future date gets (B278), so an item goes
# live at the second rather than at the next cron run. `user-api` for
# `current_user_id`/`current_user_has_permission` (B326): the item form's
# "Publishing schedule" group is shown only to a holder of `schedule
# publishing`, converted to and from their own time zone.
host_interfaces = ["db", "logging", "item-api", "timer", "user-api"]
raw_sql = true
item_background = true
