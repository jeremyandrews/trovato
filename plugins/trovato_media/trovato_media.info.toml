name = "trovato_media"
description = "Media entity wrapping file_managed with revision tracking"
version = "0.99.0"
api_version = "0.99"
dependencies = []

[taps]
implements = [
    "tap_item_info",
    "tap_item_access",
    "tap_menu",
    "tap_perm",
]
weight = 0

[migrations]
files = [
    "migrations/001_gather_queries.sql",
    "migrations/002_url_aliases.sql",
    "migrations/003_roles.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
host_interfaces = ["logging"]
