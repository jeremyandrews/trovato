name = "trovato_locale"
description = "Interface string translation with .po file import"
version = "0.106.0"
api_version = "0.106"
dependencies = []

[taps]
implements = [
    "tap_menu",
    "tap_perm",
]
weight = -10

[migrations]
files = [
    "migrations/001_create_locale_string.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
host_interfaces = []

# Site configuration this plugin owns: `config export` writes each row of
# these tables and `config import` reads them back.
[config]
tables = ["locale_string"]
