name = "goose"
description = "Load testing: test runs, scenarios, endpoint results, sites, comparisons"
version = "0.102.0"
api_version = "0.102"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_item_info",
    "tap_menu",
    "tap_perm",
]
weight = 0

# Migrations are forward-only (no rollback). Each file runs once, tracked in the
# plugin_migration table. Kernel tables (item, gather_query, url_alias, roles,
# role_permissions) are guaranteed to exist before plugin migrations run.
[migrations]
files = [
    "migrations/001_roles.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
host_interfaces = []
