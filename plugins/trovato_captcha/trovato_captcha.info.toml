name = "trovato_captcha"
description = "Cloudflare Turnstile CAPTCHA validation for form submissions"
version = "0.101.0"
api_version = "0.101"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_perm",
    "tap_form_validate",
]
weight = 0

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
host_interfaces = ["http", "logging", "variables"]
