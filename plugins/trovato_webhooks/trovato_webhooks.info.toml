name = "trovato_webhooks"
description = "Event-driven webhook dispatch with HMAC-SHA256 signatures"
version = "0.101.0"
api_version = "0.101"
dependencies = []

[taps]
implements = [
    "tap_menu",
    "tap_perm",
]
weight = 0

[migrations]
files = [
    "migrations/001_create_webhook.sql",
    "migrations/002_create_webhook_delivery.sql",
    "migrations/003_gather_queries.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared). The kernel
# builds this plugin's WASM linker from host_interfaces — it receives exactly
# the host interfaces named here (plus baseline WASI). Derived from the
# compiled .wasm import section.
[capabilities]
host_interfaces = []
