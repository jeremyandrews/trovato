# HAProxy for the two node harness (docker-compose.cluster.yml).
#
# Round robin across node-a and node-b with no stickiness, which is what a
# plain cloud load balancer does. A request carrying `X-Trovato-Node: a` or
# `X-Trovato-Node: b` goes to that node instead, so a test can write on one
# node and read on the other deterministically. The pin is proxy config only;
# the kernel knows nothing about it.
#
# Every response says which server answered in `X-Trovato-Served-By`.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s

# Docker's embedded DNS, so a restarted kernel container (new address) is
# found again without restarting the proxy.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend web
    bind :80
    use_backend node_a if { req.hdr(X-Trovato-Node) -m str a }
    use_backend node_b if { req.hdr(X-Trovato-Node) -m str b }
    default_backend nodes

backend nodes
    balance roundrobin
    http-response set-header X-Trovato-Served-By %s
    server a node-a:3000 check resolvers docker init-addr none
    server b node-b:3000 check resolvers docker init-addr none

backend node_a
    http-response set-header X-Trovato-Served-By %s
    server a node-a:3000 resolvers docker init-addr none

backend node_b
    http-response set-header X-Trovato-Served-By %s
    server b node-b:3000 resolvers docker init-addr none
