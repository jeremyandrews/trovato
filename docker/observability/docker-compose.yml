# A local trace and metrics viewer for a Trovato server on this machine.
#
#   docker compose -f docker/observability/docker-compose.yml up -d
#
# Then start Trovato with export on and the token this Prometheus sends:
#
#   TRACING_EXPORT=otlp METRICS_TOKEN=local-observability-token-not-for-production \
#     cargo run --release
#
# Jaeger (traces):        http://localhost:16686
# Grafana (dashboard):    http://localhost:3001  (Trovato > Trovato overview)
# Prometheus:             http://localhost:9090
#
# For a developer's machine only: Grafana lets anyone in as an admin, every
# port is bound to 127.0.0.1, and the metrics token is in this directory.
# docs/tracing.md covers a real deployment.
name: trovato-observability

services:
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686" # UI
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318" # OTLP over HTTP, what Trovato sends
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # Trovato runs on the host, not in this network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
