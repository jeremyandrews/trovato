# cargo-audit configuration
# See: https://docs.rs/cargo-audit/

[advisories]
# Advisories to ignore (with justification and review date)
ignore = [
    # NOTE: RUSTSEC-2023-0071 (rsa Marvin Attack, transitive via sqlx-mysql)
    # is no longer suppressed. sqlx 0.9 moved rsa behind the optional
    # `mysql-rsa` feature, which Trovato does not enable, so no rsa remains in
    # Cargo.lock. The same upgrade (sqlx 0.8 -> 0.9.1) lifted sqlx-sqlite's
    # cap on libsqlite3-sys, clearing RUSTSEC-2026-0459 by moving
    # libsqlite3-sys to 0.40; that advisory was never suppressed.

    # NOTE: every wasmtime and cranelift advisory is FIXED, not suppressed.
    # RUSTSEC-2026-0085 through -0096, -0114 (the 2026-04 batch against
    # wasmtime <=43) and -0222 (type-index confusion across engines) all cleared
    # by upgrading wasmtime 43 -> 47.0.3. `cargo audit` with this whole ignore
    # list removed reports no wasmtime or cranelift advisory. Do not re-add
    # entries here for them; if one reappears, the runtime needs upgrading
    # again.

    # NOTE: RUSTSEC-2026-0149 (wasmtime-wasi 43 path_open(TRUNCATE) bypasses
    # FilePerms::WRITE) is no longer suppressed. The advisory was always
    # unreachable — the Trovato plugin sandbox hand-writes its five
    # wasi_snapshot_preview1 stubs and never constructs a WasiCtx or preopens a
    # directory — and the wasmtime-wasi crate that carried it was a vestigial
    # dependency referenced in zero source files. It has been removed from the
    # kernel and the phase0 benchmark; no wasmtime-wasi remains in Cargo.lock.

    # NOTE: RUSTSEC-2026-0098/-0099/-0104 (rustls-webpki cert-validation bugs)
    # are no longer suppressed. Both carriers are now gone: the reachable lettre
    # chain was fixed by bumping rustls-webpki to 0.103.13, and the only other
    # hit (rustls-webpki 0.101.7, pinned transitively by the AWS SDK's legacy
    # rustls 0.21 path) was eliminated by dropping the unused s3 feature + AWS
    # SDK for 1.0. No webpki 0.101 / rustls 0.21 remains in Cargo.lock.

    # NOTE: RUSTSEC-2026-0141 (lettre TLS hostname verification with the
    # Boring backend) and RUSTSEC-2026-0194/-0195 (quick-xml 0.38 DoS pair) are
    # no longer suppressed: neither matches anything in Cargo.lock (lettre is
    # 0.11.23 with the rustls backend; quick-xml is 0.42). `cargo audit` with
    # this whole ignore list removed reports no vulnerability.

    # NOTE: RUSTSEC-2026-0189 (rmcp 0.16 DNS rebinding in the Streamable HTTP
    # server transport) is no longer suppressed. It was never compiled here,
    # since trovato-mcp serves over STDIO with `transport-io` only, and it is now
    # fixed outright: trovato-mcp moved from rmcp 0.16 to 3.10, past the
    # >=1.4.0 fix, with the same feature set (the default server, macros and
    # base64, plus transport-io). RUSTSEC-2026-0462 (unbounded response
    # buffering in the 0.16 Streamable HTTP clients, equally never compiled)
    # cleared with it. `cargo audit` with this whole ignore list removed
    # reports no rmcp advisory. Do not re-add entries here for either; if one
    # reappears, rmcp needs upgrading again.
]
