# cargo-nextest configuration. See docs/testing-ci.md for how CI uses it.

# The CI profile. `slow-timeout` only marks a test SLOW in the output after
# 10 s; it never kills one (no `terminate-after`), and nothing is retried:
# a test that fails is a failure to root cause, not to rerun away. The hard
# per-test budget is the 30 s guard, scripts/ci-slow-tests.sh, which reads
# the JUnit report written here.
[profile.ci]
slow-timeout = { period = "10s" }
retries = 0
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# The cluster scenarios share one two node site and some restart its
# servers, so they run one at a time. Under libtest a static mutex in
# cluster_test.rs did this; under nextest every test is its own process and
# a static is per process, so the serialization has to live here.
[test-groups]
cluster = { max-threads = 1 }
ai-send-path = { max-threads = 1 }
cron-scheduler = { max-threads = 1 }
timer-plugin = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(cluster_test)"
test-group = "cluster"

# The B89 AI send path tests point the site's one AI provider at their own
# stub and read back the usage rows that provider collected, so two of them
# running at once see each other's provider and rows. Their static SERIAL
# mutex serializes them under libtest only; under nextest it has to be here.
[[profile.default.overrides]]
filter = "binary(ai_usage_budget_test) | binary(ai_send_path_test)"
test-group = "ai-send-path"

# The B178 built-in cron scheduler tests each set the one `cron_interval_secs`
# site_config row and run a scheduler on it, so two at once would read each
# other's interval. Their static SERIAL mutex serializes them under libtest
# only; under nextest it has to be here.
[[profile.default.overrides]]
filter = "binary(cron_scheduler_test)"
test-group = "cron-scheduler"

# The B278 plugin timer tests share the one `test_timer` owner, and each runs
# a scheduler over it, so one test's scheduler would fire another's timers.
# Their static SERIAL mutex serializes them under libtest only; under nextest
# it has to be here.
[[profile.default.overrides]]
filter = "binary(timer_plugin_test)"
test-group = "timer-plugin"
