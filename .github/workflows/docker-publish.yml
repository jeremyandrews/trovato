name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      # Documentation-only commits cannot change build or test outcomes, and a
      # full CI run costs roughly 58 job-minutes plus a Docker image build.
      #
      # This is safe only while `main` has no required status checks. If branch
      # protection with required checks is ever enabled, revisit it: a skipped
      # required check stays pending forever and blocks the merge.
      - '**/*.md'
  workflow_dispatch:

# One publish per ref. A second run for the same ref would race the first over
# the mutable tags (`nightly`, `latest`, `<major>.<minor>`) and the winner is
# whichever finishes last, not whichever is newer. A single `v0.104.0` push
# started two runs that raced on `0.104.0`, `0.104` and `latest`.
#
# Branch pushes cancel: only the newest commit on `main` is worth publishing.
# Tag pushes do not, because a release is published once and cancelling it
# leaves a half-pushed manifest behind.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Compute version once, share across jobs
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive BASE_VERSION from the workspace version
        # The major and minor of [workspace.package] version, which is the one
        # place the project version is authored. Nightly tags are derived from
        # it, so reading it here keeps the workflow from carrying a copy that a
        # release can leave behind. See docs/design/version-map.md.
        run: |
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          echo "BASE_VERSION=${VERSION%.*}" >> "$GITHUB_ENV"
          echo "BASE_VERSION is ${VERSION%.*} (from $VERSION)"

      - name: Compute version
        id: version
        run: |
          # SC2193: shellcheck cannot see that `${{ github.ref }}` is a
          # placeholder, so it reads the comparison as two fixed strings.
          # SC2086: $GITHUB_OUTPUT and the version parts never contain spaces.
          # SC2001: the sed call is clearer here than a parameter expansion.
          # shellcheck disable=SC2193,SC2086,SC2001
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            LATEST=$(git tag -l "v${BASE_VERSION}.*" --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              COUNT=$(git rev-list --count HEAD)
              NEXT="${BASE_VERSION}.${COUNT}"
            else
              PATCH=$(echo "$LATEST" | sed "s/v${BASE_VERSION}\.\([0-9]*\).*/\1/")
              COMMITS_SINCE=$(git rev-list --count "${LATEST}..HEAD")
              NEXT="${BASE_VERSION}.$((PATCH + COMMITS_SINCE))"
            fi
            echo "version=${NEXT}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "Computed version: $(grep version "$GITHUB_OUTPUT")"

  # Build per-platform images and push by digest
  build:
    name: Build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Both platforms build on every run, nightly and release alike. arm64
          # used to be release-only because it cross-built under QEMU and took
          # over three hours; nightlies were published under release-shaped
          # version tags carrying amd64 alone, and an arm64 consumer that
          # tracks versions pulled one and got `no match for platform in
          # manifest`. A native arm64 runner removes the reason to skip it.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
        timeout-minutes: 60

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge platform images into a single multi-arch manifest
  merge:
    name: Create Manifest
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Each artifact keeps its own directory, so the check below can tell
      # which platform a digest came from. Merged into one directory they are
      # just two opaque filenames.
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*

      - name: Require a digest from both platforms
        # `build` has `fail-fast: false` and this job needed only `build`, so a
        # single failed or skipped leg used to reach here and publish a
        # single-platform image under the full tag set. Nothing downstream
        # noticed. Refuse to publish anything but a complete pair.
        run: |
          total=0
          missing=""
          for arch in amd64 arm64; do
            dir="/tmp/digests/digests-${arch}"
            count=$(find "$dir" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "digests-${arch}: ${count} digest(s)"
            total=$((total + count))
            if [ "$count" -ne 1 ]; then
              missing="${missing} digests-${arch} (${count})"
            fi
          done
          if [ -n "$missing" ] || [ "$total" -ne 2 ]; then
            echo "::error::Refusing to publish an incomplete manifest. Expected exactly two digests, one from digests-amd64 and one from digests-arm64; got ${total} total, wrong count for:${missing:- none}. Check the Build (linux/amd64) and Build (linux/arm64) jobs."
            find /tmp/digests -type f -o -type d | sort >&2
            exit 1
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=nightly,enable={{is_default_branch}}
            type=sha,prefix=nightly-,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ needs.version.outputs.is_release }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.is_release }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release }}

      - name: Create manifest list and push
        run: |
          # Each digest is an empty file named after the digest it stands for,
          # one per platform directory.
          refs=""
          for digest in /tmp/digests/digests-*/*; do
            refs="${refs} ${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$digest")"
          done
          echo "Merging:${refs}"
          # SC2046/SC2086: both are argument lists and must word-split.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${refs}

      - name: Verify the published image carries both platforms
        # The last line of defence: assert against the registry what was
        # actually published, not against what this run intended to publish.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ref="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools inspect "$ref" | tee /tmp/inspect.txt
          missing=""
          for platform in linux/amd64 linux/arm64; do
            # `unknown/unknown` entries are provenance attestations and are
            # expected alongside the real platforms; they are simply not matched.
            if ! grep -qE "^[[:space:]]*Platform:[[:space:]]+${platform}[[:space:]]*$" /tmp/inspect.txt; then
              missing="${missing} ${platform}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::${ref} is missing platform(s):${missing}. A version tag must carry both linux/amd64 and linux/arm64; a consumer on the missing architecture gets 'no match for platform in manifest'."
            exit 1
          fi
          echo "${ref} carries linux/amd64 and linux/arm64."
