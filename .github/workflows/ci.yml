name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation-only commits cannot change build or test outcomes, and a
      # full CI run costs roughly 58 job-minutes plus a Docker image build.
      #
      # This is safe only while `main` has no required status checks. If branch
      # protection with required checks is ever enabled, revisit it: a skipped
      # required check stays pending forever and blocks the merge.
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      # Documentation-only commits cannot change build or test outcomes, and a
      # full CI run costs roughly 58 job-minutes plus a Docker image build.
      #
      # This is safe only while `main` has no required status checks. If branch
      # protection with required checks is ever enabled, revisit it: a skipped
      # required check stays pending forever and blocks the merge.
      - '**/*.md'
  # Runs the whole workflow by hand, including the Coverage job, which does not
  # run on pull requests.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The pinned toolchain version, kept in lock-step with rust-toolchain.toml's
  # `channel` (see the bump-protocol comment there). dtolnay/rust-toolchain
  # requires an explicit toolchain and does NOT read rust-toolchain.toml, so CI
  # pins the version here; centralizing it in one env var keeps every job in sync.
  RUST_TOOLCHAIN: "1.96.0"
  # Incremental artifacts are pure bloat in CI (no edit-rebuild loop) and add to
  # the target/ size that exhausts the runner disk during linking — see the Test
  # and Coverage jobs' free-disk-space steps. Turn them off everywhere.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # DO NOT add `shared-key` here to "deduplicate" the clippy/doc caches.
      # It was tried on 2026-07-27 and reverted, measured both ways:
      #
      #   - The premise was false. Swatinem/rust-cache keys on the job ID, so the
      #     matrix Test shards ALREADY share one cache (run 30281455368: all
      #     three restored the same key, "full match: true"). There was no
      #     fragmentation to fix, and no cold starts anywhere — all seven cached
      #     jobs reported full matches.
      #   - It cost minutes. A new key guarantees a miss: Clippy 2.2 -> 6.0 and
      #     Doc 1.2 -> 5.2 job-minutes on run 30284784322.
      #   - It did not even achieve its own storage goal. The shared cache is a
      #     THIRD entry alongside the clippy and doc caches it replaces, so usage
      #     went 9.72 -> 10.18 GB and crossed the 10 GB limit.
      #
      # If cache storage needs reducing, the target is Docker: buildkit blobs
      # were 3.74 GB of that total, which is what the paths-ignore filters at the
      # top of this file address.
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        # --workspace, not the default members: every `plugins/*` crate is a
        # workspace member and none of them was in default-members, so plugin
        # code was unlinted by this job until 2026-08-19. Contributors write
        # plugins; the lint has to reach them.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # THE LOCAL GATE IS STRICTLY STRONGER THAN THIS JOB. Read this before trusting
  # a green CI run as equivalent to a green local run.
  #
  # `./scripts/pre-commit-check.sh --full` followed by `cargo test --all` runs
  # every test target against ONE database, so cross-file interference is
  # observable. This job splits the targets across three runners with three
  # separate databases, so two files that interact through shared state can land
  # in different shards and never meet. CI green therefore does NOT imply
  # `cargo test --all` green.
  #
  # That asymmetry is accepted deliberately rather than closed, because the two
  # ways to close it are both worse:
  #
  #   - Un-sharding puts us back on one runner linking 43 test binaries at
  #     ~180 MB each, which is the disk exhaustion that caused this in the first
  #     place (see the reclaim step below).
  #   - A fresh database per test target would make cross-file contamination
  #     structurally IMPOSSIBLE to observe, which is worse than observing it in
  #     only one shard: it would convert a detectable bug class into an
  #     undetectable one, while costing 43 migration runs per shard.
  #
  # So the gap is mitigated instead: the shared seeders are made concurrency-safe
  # at the root (advisory lock, tests/common/mod.rs), and each shard runs a
  # contamination guard after its targets. Anyone changing shared test fixtures
  # should run `cargo test --all` locally — CI will not catch it for you.
  #
  # One thing this job DOES now catch that a single local run does not: each
  # shard runs its targets TWICE against one database, and fails if a pass
  # grew the shared fixture. The database is not migrated beforehand either,
  # so the harness has to prepare it. Those two properties — runnable again,
  # runnable from a bare `createdb` — were invisible to every job here until
  # they were added.
  #
  # CAPACITY, when this job starts running out of disk again. Shard 1 used to
  # carry all of the unit and doc tests and finished at ~13 GB free, against
  # 19-20 GB for shards 2 and 3, so it was the one that tipped first. They are
  # now spread one part per shard (see "Unit tests" below). If one shard still
  # tips, the recorded remedy is backlog key `ci-split-unit-doc-job`: move the
  # unit/doc steps into their own job, NOT add a fourth shard (a fourth shard
  # re-pays the whole dependency build for no additional linking relief). A
  # GitHub-hosted larger runner is not an option — it needs an
  # organization-owned repo, and `ci-larger-runner` is closed as REJECTED, not
  # deferred.
  #
  # WALL CLOCK. The slowest job sets how long a pull request waits, and this
  # job's slowest shard is usually it. docs/testing-ci.md has the budget, where
  # each shard's minutes go, and how to remeasure them.
  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # BUDGET: expected time plus half, to catch a hang, not to time a run.
    # Expected 20 minutes, warm (16-20 in run 45438628822, before the
    # weights were refreshed from it). A cold dependency cache, which only a
    # toolchain or a dev profile change causes (rust-cache falls back to the
    # last cache when Cargo.lock changes), took up to 30 (run 45432520463):
    # if one is ever cancelled here, raise this for that one run so the cache
    # can save, rather than retrying. docs/testing-ci.md has the budgets.
    timeout-minutes: 30
    strategy:
      # One shard's failure should not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trovato
          POSTGRES_PASSWORD: trovato
          POSTGRES_DB: trovato_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://trovato:trovato@localhost:5432/trovato_test
      REDIS_URL: redis://127.0.0.1:6379
      RUST_LOG: warn
      TOTAL_SHARDS: 3
    steps:
      - uses: actions/checkout@v5

      # Reclaim the ~25-30 GB of preinstalled toolchains we never use.
      #
      # This step alone used to be the whole fix for the intermittent
      # "No space left on device" + "ld terminated with signal 7 [Bus error]"
      # failures — the SIGBUS during ld is the linker mmap-ing temp/output files
      # on a volume that ran out of space mid-link, so the Bus error and the
      # disk-full error are the SAME event. It is no longer sufficient on its
      # own, which is why the job is now sharded (see "Run tests" below):
      # ubuntu-latest gives ~14 GB free and this gets us to ~33 GB, but a full
      # `cargo test --all` links 50+ integration test binaries at ~180 MB each
      # (~9.5 GB) on top of the dependency build, sqlx-cli, and the WASM
      # plugins. Measured 2026-07-27 after Epic 4 pushed it over the edge.
      # Cutting debuginfo was tried and rejected: `line-tables-only` shrinks a
      # test binary only 182 MB -> 172 MB, ~5%, nowhere near enough.
      #
      # In the background: the deletion took 0.9 to 1.7 minutes of every
      # shard's critical path (run 45316035626), and nothing before the
      # integration build needs the space. The toolchain, the cache restore,
      # the WASM build and the unit or doc step run meanwhile; "Wait for the
      # disk space" below is the point past which the space is needed, and it
      # waits for this to finish.
      - name: Free up runner disk space (in the background)
        run: |
          df -h /
          # shellcheck disable=SC2016 # expanded by the inner shell, on purpose
          nohup sh -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell || true
            sudo docker image prune --all --force || true
            touch "$RUNNER_TEMP/disk-reclaimed"' > "$RUNNER_TEMP/disk-reclaim.log" 2>&1 &

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      # rust-cache keys on the lockfile and the manifests' dependencies, not
      # on `[profile]`: without this, a change to the dev profile in Cargo.toml
      # hits the old cache in full, rebuilds the dependencies it changed in every
      # run, and never saves them (runs 45406677098 to 45425763074 all restored
      # one key, through three different profiles).
      - name: Key the cache on the dev profile
        id: profile
        run: echo "hash=$(awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-${{ steps.profile.outputs.hash }}
      # Prebuilt binary; see the sqlx-cli note in the Coverage job.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # NO `sqlx migrate run` STEP, deliberately, and no sqlx-cli to run it
      # with. The test harness migrates the database itself, before it seeds
      # anything (`ensure_database_migrated`, crates/kernel/tests/common/mod.rs),
      # which is the behaviour a contributor gets after a bare `createdb`. A
      # migrate step here would run the suite against a database the harness
      # never had to prepare, so the one path everybody takes locally would be
      # the one path CI never exercised — and it was: `cargo test` on an
      # unmigrated database collapsed at the first target needing the shared
      # app, for months, green all the while.
      #
      # If something here ever does need the schema before `cargo test`, add
      # sqlx-cli back for that step alone and say why; do not restore a blanket
      # migrate.

      - name: Build WASM plugins
        run: |
          cargo build -p trovato_blog -p trovato_search \
            -p test_e2e_caller -p test_e2e_callee -p test_e2e_bystander -p test_e2e_nocaps \
            -p test_ai_background \
            -p trovato_field_access_ref \
            -p trovato_recovery_ref -p test_recovery_bystander \
            -p test_queue_worker -p test_item_writer -p test_site_queries -p test_item_deny -p test_members -p test_menu_entries -p test_page_builder_components \
            -p trovato_record_ref \
            -p trovato_spam \
            -p trovato_series -p test_plugin_api \
            -p test_assistant_scope \
            -p trovato_book -p trovato_contact \
            -p trovato_ai -p test_form_taps -p test_form_taps_b -p test_owned_vocabulary \
            --target wasm32-wasip1 --release
          mkdir -p plugins/trovato_blog plugins/trovato_search \
            plugins/test_e2e_caller plugins/test_e2e_callee \
            plugins/test_e2e_bystander plugins/test_e2e_nocaps \
            plugins/test_ai_background \
            plugins/trovato_field_access_ref \
            plugins/trovato_recovery_ref plugins/test_recovery_bystander \
            plugins/test_queue_worker plugins/test_item_writer plugins/test_site_queries plugins/test_item_deny plugins/test_members plugins/test_menu_entries plugins/test_page_builder_components plugins/trovato_record_ref plugins/trovato_spam plugins/trovato_series plugins/test_plugin_api plugins/trovato_book plugins/trovato_contact plugins/test_assistant_scope \
            plugins/trovato_ai plugins/test_form_taps plugins/test_form_taps_b plugins/test_owned_vocabulary
          cp target/wasm32-wasip1/release/trovato_blog.wasm plugins/trovato_blog/
          cp target/wasm32-wasip1/release/trovato_search.wasm plugins/trovato_search/
          cp target/wasm32-wasip1/release/test_e2e_caller.wasm plugins/test_e2e_caller/
          cp target/wasm32-wasip1/release/test_e2e_callee.wasm plugins/test_e2e_callee/
          cp target/wasm32-wasip1/release/test_e2e_bystander.wasm plugins/test_e2e_bystander/
          cp target/wasm32-wasip1/release/test_e2e_nocaps.wasm plugins/test_e2e_nocaps/
          cp target/wasm32-wasip1/release/test_ai_background.wasm plugins/test_ai_background/
          cp target/wasm32-wasip1/release/trovato_field_access_ref.wasm plugins/trovato_field_access_ref/
          cp target/wasm32-wasip1/release/trovato_recovery_ref.wasm plugins/trovato_recovery_ref/
          cp target/wasm32-wasip1/release/test_recovery_bystander.wasm plugins/test_recovery_bystander/
          cp target/wasm32-wasip1/release/test_queue_worker.wasm plugins/test_queue_worker/
          cp target/wasm32-wasip1/release/test_item_writer.wasm plugins/test_item_writer/
          cp target/wasm32-wasip1/release/test_site_queries.wasm plugins/test_site_queries/
          cp target/wasm32-wasip1/release/test_item_deny.wasm plugins/test_item_deny/
          cp target/wasm32-wasip1/release/test_members.wasm plugins/test_members/
          cp target/wasm32-wasip1/release/test_menu_entries.wasm plugins/test_menu_entries/
          cp target/wasm32-wasip1/release/test_page_builder_components.wasm plugins/test_page_builder_components/
          cp target/wasm32-wasip1/release/trovato_record_ref.wasm plugins/trovato_record_ref/
          cp target/wasm32-wasip1/release/trovato_spam.wasm plugins/trovato_spam/
          cp target/wasm32-wasip1/release/trovato_book.wasm plugins/trovato_book/
          cp target/wasm32-wasip1/release/trovato_contact.wasm plugins/trovato_contact/
          cp target/wasm32-wasip1/release/trovato_series.wasm plugins/trovato_series/
          cp target/wasm32-wasip1/release/test_plugin_api.wasm plugins/test_plugin_api/
          cp target/wasm32-wasip1/release/test_assistant_scope.wasm plugins/test_assistant_scope/
          cp target/wasm32-wasip1/release/trovato_ai.wasm plugins/trovato_ai/
          cp target/wasm32-wasip1/release/test_form_taps.wasm plugins/test_form_taps/
          cp target/wasm32-wasip1/release/test_form_taps_b.wasm plugins/test_form_taps_b/
          cp target/wasm32-wasip1/release/test_owned_vocabulary.wasm plugins/test_owned_vocabulary/

      # The expand-then-contract rule (docs/design/upgrades-and-probes.md §3):
      # a new migration that would break the previous release fails here unless
      # it carries `-- trovato:contract <release>: <reason>`. First, on its own,
      # so a failure says what it is; the unit test step reuses its build.
      - name: Migration compatibility rule
        if: matrix.shard == 1
        run: cargo nextest run --workspace --lib --profile ci -E 'test(migration_rule)'

      # Unit + doc tests are cheap relative to the integration binaries, so each
      # runs once for the whole workspace rather than on all three shards. They
      # are split one part per shard, because each part's cost is mostly one
      # compile of the kernel with `cfg(test)`: on one shard they were 6.7
      # minutes that put shard 1 ten minutes behind the other two (run
      # 45316035626). scripts/ci-test-shard.sh starts each shard's integration
      # share from these, through the `@shard` lines of
      # .config/ci-test-weights.txt; move a part here and move its line there.
      #
      # `--bins` is NOT redundant with `--lib`, and leaving it off silently drops
      # tests: `trovato-phase0` has no library target at all, so its 13 unit
      # tests exist only in its bin target. (For `trovato-kernel` the two do
      # overlap — main.rs declares the same module set as lib.rs and defines no
      # tests of its own, so its unit tests run twice. That duplication costs a
      # few seconds and one binary link, which is a price worth paying to avoid
      # hard-coding which packages need `--bins` — the same fail-open trap the
      # dynamic target enumeration below exists to avoid.)
      #
      # Under nextest, one process per test and as many at once as there are
      # cores, which is what dropped `--test-threads=1`: what it guarded was the
      # process environment, which `EnvGuard` (crates/test-utils/src/env.rs)
      # already locks and which no other test process can see.
      - name: Unit tests (library targets)
        if: matrix.shard == 1
        run: cargo nextest run --workspace --lib --profile ci
      - name: Unit tests (binary targets)
        if: matrix.shard == 2
        run: cargo nextest run --workspace --bins --profile ci
      # nextest does not run doc tests; cargo does.
      - name: Doc tests
        if: matrix.shard == 3
        run: cargo test --all --doc

      # Here, not before the first build: the unit or doc step builds into
      # the ~14 GB the runner starts with while the deletion runs (it took
      # 74 to 108 s of waiting in run 45406677098), and is done long before
      # the 60-odd integration binaries below need the reclaimed space.
      - name: Wait for the disk space
        run: |
          until [ -f "$RUNNER_TEMP/disk-reclaimed" ]; do sleep 2; done
          cat "$RUNNER_TEMP/disk-reclaim.log"
          df -h /

      # Integration tests, split across shards so no single runner has to link
      # all 50+ test binaries onto one 33 GB volume. The enumeration and the
      # partition live in `scripts/ci-test-shard.sh` — a script rather than
      # inline YAML because it is now run twice, and because a CI script nobody
      # can execute locally is a script that only gets debugged by pushing.
      #
      # The database is NOT migrated beforehand (see the note above the WASM
      # step): this first pass starts from the bare database the Postgres
      # service created, so the harness's own migration is exercised on every
      # run.
      - name: Run integration tests (shard ${{ matrix.shard }}/3)
        env:
          SHARD: ${{ matrix.shard }}
          TIMINGS_FILE: target/ci-timings/pass-1.txt
        run: mkdir -p target/ci-timings && ./scripts/ci-test-shard.sh

      # A snapshot of the rows that a pass must not add to, for the guard after
      # the second pass.
      #
      # The point is that two green passes say nothing about the fifth. Each of
      # these three is something a pass was quietly growing, and each fed a page
      # or a form that eventually broke on the size of it rather than on
      # anything to do with the test that failed:
      #
      #   roles        `/admin/people/permissions` renders every permission for
      #                every role on one page, read under a 4 MB cap. About a
      #                hundred roles a run; the cap gave out near five hundred.
      #   item_type    `/admin/structure/types` and `/admin/content/add` list
      #                every type there is, and two tests made one per run.
      #   page fields  the admin field form appends to `settings->fields`
      #                without checking for a name already there, so a test that
      #                added a field to the shared `page` type added another copy
      #                every run. Three copies in, the content-translation form
      #                rendered none of the type's fields at all — four passes
      #                was what it took to show up, which is exactly why this is
      #                a guard on the growth and not on the symptom.
      - name: Snapshot the shared fixture between passes
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || sudo apt-get install -y -qq postgresql-client
          {
            echo "SNAP_ROLES=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM roles')"
            echo "SNAP_TYPES=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM item_type')"
            echo "SNAP_PAGE_FIELDS=$(psql "$DATABASE_URL" -tAc \
              "SELECT coalesce(jsonb_array_length(settings->'fields'), 0) FROM item_type WHERE type = 'page'")"
          } >> "$GITHUB_ENV"

      # THE SECOND PASS, against the SAME database. This is the property, and
      # it is not "the suite passes" — it is "the suite passes again".
      #
      # A test that creates a role, a user with a fixed name, an AI usage row or
      # a per-user override and does not remove it passes the first time and
      # fails the second, and until this step existed no CI job could see that:
      # every job started from a database nobody had run the suite against. It
      # was visible only to whoever ran the suite twice locally and remembered
      # not to drop the database in between, and CONTRIBUTING.md told people to
      # drop it, so in practice nobody.
      #
      # COST, measured end to end rather than estimated. The second pass is the
      # tests alone — nothing is rebuilt and nothing is relinked — so it is a
      # fraction of the first, which carries the compile and the link of the
      # shard's test binaries. Run 37411105400 against its merge base
      # (37310835359):
      #
      #   first pass    8.9, 8.5, 5.8 min across the three shards
      #   second pass   2.5, 3.1, 2.1 min  =  7.7 job-minutes added
      #   workflow      61 -> 71 job-minutes
      #   wall clock    18 -> 17 min, i.e. unchanged: the critical path is the
      #                 Coverage job, and the slowest shard still finishes inside
      #                 it.
      #
      # So this is a step on every pull request rather than the nightly it could
      # have been. A nightly finds the regression after it is merged, by which
      # time the branch that caused it has moved on — and at three minutes a
      # shard, off the critical path, there is nothing to buy by waiting.
      - name: Re-run integration tests on the same database (shard ${{ matrix.shard }}/3)
        env:
          SHARD: ${{ matrix.shard }}
          TIMINGS_FILE: target/ci-timings/pass-2.txt
        run: ./scripts/ci-test-shard.sh

      # A pass must not leave state behind.
      #
      # Two green passes prove the suite survives one repetition; they say
      # nothing about the fifth, and none of the three failures this guards
      # against showed up on the second run. So the guard is on the growth, not
      # on the symptom: a pass that adds rows is a pass that has stopped cleaning
      # up after itself, however long the page it feeds takes to give out.
      #
      # No allowance on any of the three: measured flat on all three shards once
      # the leaks were fixed (roles 7 -> 7, item_type 13 -> 13, 11 -> 11 and
      # 10 -> 10, page fields 1 -> 1). A fixture that a test needs permanently is
      # created on the first pass and found on the second, so it is flat too —
      # growth between two passes means something was not cleaned up, and the
      # `check` calls keep an allowance argument only so that a future exception
      # has somewhere to be written down with its reason.
      - name: The shared fixture must not grow across a pass
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || sudo apt-get install -y -qq postgresql-client
          fail=0

          check() {  # name before after allowance hint
            echo "$1 after pass 1: $2; after pass 2: $3"
            if [ "$3" -gt "$(($2 + $4))" ]; then
              echo "::error::a pass added $(($3 - $2)) to $1 ($2 -> $3). $5"
              fail=1
            fi
          }

          AFTER_ROLES=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM roles')
          check roles "$SNAP_ROLES" "$AFTER_ROLES" 0 \
            "A test created a role and did not remove it: make it go through common::create_test_role."
          if [ "$AFTER_ROLES" -gt "$SNAP_ROLES" ]; then
            psql "$DATABASE_URL" -c "SELECT name, created FROM roles ORDER BY created DESC LIMIT 20"
          fi

          AFTER_TYPES=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM item_type')
          check item_type "$SNAP_TYPES" "$AFTER_TYPES" 0 \
            "A test created a content type and did not remove it: register TestApp::cleanup_content_type_on_exit."
          if [ "$AFTER_TYPES" -gt "$SNAP_TYPES" ]; then
            psql "$DATABASE_URL" -c "SELECT type, plugin FROM item_type ORDER BY type"
          fi

          AFTER_PAGE=$(psql "$DATABASE_URL" -tAc \
            "SELECT coalesce(jsonb_array_length(settings->'fields'), 0) FROM item_type WHERE type = 'page'")
          check "page fields" "$SNAP_PAGE_FIELDS" "$AFTER_PAGE" 0 \
            "A test changed the shared 'page' type and did not put it back: register TestApp::restore_content_type_on_exit."
          if [ "$AFTER_PAGE" -gt "$SNAP_PAGE_FIELDS" ]; then
            psql "$DATABASE_URL" -c \
              "SELECT f->>'field_name' FROM item_type, jsonb_array_elements(settings->'fields') f WHERE type = 'page'"
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "the shared fixture did not grow across the second pass."

      # Shared-fixture contamination guard.
      #
      # Sharding costs CI a real property: with the targets split across three
      # runners and three databases, a file that corrupts shared state and a
      # file that asserts on it can land in different shards, so the damage is
      # invisible. That is not hypothetical — it is exactly how
      # `tutorial_test`'s "exactly 3 hand-created conferences" assertion was
      # passing in CI while `cargo test --all` failed locally: the
      # contaminating file (`gather_semantic_test`, three parallel callers
      # racing the check-then-insert in `ensure_conference_items`) was in a
      # different shard from the file that noticed.
      #
      # The race itself is fixed at its root (an advisory lock in the shared
      # seeder). This step is the standing guard against the CLASS returning:
      # after each shard's targets have run, the shared fixture must be exactly
      # what it claims to be. It catches duplication caused by any file in this
      # shard, which is the most a sharded job can check.
      #
      # It does NOT make CI equivalent to a single-database `cargo test --all` —
      # see the note at the top of this job. That gap is documented, not closed.
      - name: Shared-fixture contamination guard
        run: |
          set -euo pipefail
          # Do not assume the runner image ships psql: a missing binary here
          # would fail a green build for the wrong reason.
          command -v psql >/dev/null 2>&1 || sudo apt-get install -y -qq postgresql-client
          DUPES=$(psql "$DATABASE_URL" -tAc "
            SELECT COALESCE(string_agg(title || '=' || n, ', '), '')
            FROM (
              SELECT title, count(*) AS n
              FROM item
              WHERE type = 'conference'
                AND title IN ('RustConf 2026', 'EuroRust 2026', 'WasmCon Online 2026')
                AND (fields->>'field_source_id' IS NULL OR fields->>'field_source_id' = '')
              GROUP BY title
              HAVING count(*) > 1
            ) d")
          if [ -n "$DUPES" ]; then
            echo "::error::shared conference fixture duplicated by a target in this shard: $DUPES"
            echo "A test seeded the shared fixture without going through the locked seeder,"
            echo "or the advisory lock in tests/common/mod.rs regressed."
            exit 1
          fi
          echo "shared conference fixture is unique — no contamination from this shard."

      # The per-test budget: no test over 30 s unless .config/slow-tests.txt
      # says why. Unit tests are timed one by one by nextest's JUnit report;
      # integration targets, which run under libtest, are timed per target (see
      # the script). Both passes count, so a test that is only slow on a
      # database that has been used once is caught too.
      - name: Slow test budget
        run: |
          set -euo pipefail
          reports="target/ci-timings/pass-1.txt target/ci-timings/pass-2.txt"
          [ -f target/nextest/ci/junit.xml ] && reports="$reports target/nextest/ci/junit.xml"
          # shellcheck disable=SC2086
          ./scripts/ci-slow-tests.sh $reports

      # The measured times, kept so the partition in .config/ci-test-weights.txt
      # can be refreshed from real runs (docs/testing-ci.md says how).
      - name: Keep the test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: |
            target/ci-timings/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 30

  # Report only: nothing reads its number to pass or fail anything. So it is
  # not on the pull request path: at 42 minutes (run 45316035626) it was the
  # longest job by ten and set every pull request's wall clock for a number
  # nobody gated on. It runs on every push to main, which is where the report
  # it uploads describes, and by hand (workflow_dispatch) for a branch.
  coverage:
    name: Coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trovato
          POSTGRES_PASSWORD: trovato
          POSTGRES_DB: trovato_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://trovato:trovato@localhost:5432/trovato_test
      REDIS_URL: redis://127.0.0.1:6379
      RUST_LOG: warn
      # Coverage instrumentation (-C instrument-coverage) bloats every binary with
      # full debug info; line-tables-only keeps line coverage accurate while
      # shrinking the instrumented artifacts that drive this job's target/ size.
      # cargo-llvm-cov appends its own flags to RUSTFLAGS, so this composes.
      RUSTFLAGS: "-C debuginfo=line-tables-only"
    steps:
      - uses: actions/checkout@v5

      # Same root-cause fix as the Test job — see that job's comment. Coverage is
      # the heavier of the two (llvm-cov instrumentation balloons target/ further),
      # so the disk-reclaim matters even more here.
      - name: Free up runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
          targets: wasm32-wasip1
      # Keyed on the dev profile too; see the Test job.
      - name: Key the cache on the dev profile
        id: profile
        run: echo "hash=$(awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-${{ steps.profile.outputs.hash }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # NOT switched to taiki-e/install-action: it has no sqlx-cli manifest
      # (verified 2026-07-27 — manifests/sqlx-cli.json 404s), so this stays a
      # from-source build. The --no-default-features/--features flags matter
      # here precisely because it IS built from source: they keep the dependency
      # tree small.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run migrations
        run: sqlx migrate run --source crates/kernel/migrations

      - name: Build WASM plugins
        run: |
          cargo build -p trovato_blog -p trovato_search \
            -p test_e2e_caller -p test_e2e_callee -p test_e2e_bystander -p test_e2e_nocaps \
            -p test_ai_background \
            -p trovato_field_access_ref \
            -p trovato_recovery_ref -p test_recovery_bystander \
            -p test_queue_worker -p test_item_writer -p test_site_queries -p test_item_deny -p test_members -p test_menu_entries -p test_page_builder_components \
            -p trovato_record_ref \
            -p trovato_spam \
            -p trovato_series -p test_plugin_api \
            -p test_assistant_scope \
            -p trovato_book -p trovato_contact \
            -p trovato_ai -p test_form_taps -p test_form_taps_b -p test_owned_vocabulary \
            --target wasm32-wasip1 --release
          mkdir -p plugins/trovato_blog plugins/trovato_search \
            plugins/test_e2e_caller plugins/test_e2e_callee \
            plugins/test_e2e_bystander plugins/test_e2e_nocaps \
            plugins/test_ai_background \
            plugins/trovato_field_access_ref \
            plugins/trovato_recovery_ref plugins/test_recovery_bystander \
            plugins/test_queue_worker plugins/test_item_writer plugins/test_site_queries plugins/test_item_deny plugins/test_members plugins/test_menu_entries plugins/test_page_builder_components plugins/trovato_record_ref plugins/trovato_spam plugins/trovato_series plugins/test_plugin_api plugins/trovato_book plugins/trovato_contact plugins/test_assistant_scope \
            plugins/trovato_ai plugins/test_form_taps plugins/test_form_taps_b plugins/test_owned_vocabulary
          cp target/wasm32-wasip1/release/trovato_blog.wasm plugins/trovato_blog/
          cp target/wasm32-wasip1/release/trovato_search.wasm plugins/trovato_search/
          cp target/wasm32-wasip1/release/test_e2e_caller.wasm plugins/test_e2e_caller/
          cp target/wasm32-wasip1/release/test_e2e_callee.wasm plugins/test_e2e_callee/
          cp target/wasm32-wasip1/release/test_e2e_bystander.wasm plugins/test_e2e_bystander/
          cp target/wasm32-wasip1/release/test_e2e_nocaps.wasm plugins/test_e2e_nocaps/
          cp target/wasm32-wasip1/release/test_ai_background.wasm plugins/test_ai_background/
          cp target/wasm32-wasip1/release/trovato_field_access_ref.wasm plugins/trovato_field_access_ref/
          cp target/wasm32-wasip1/release/trovato_recovery_ref.wasm plugins/trovato_recovery_ref/
          cp target/wasm32-wasip1/release/test_recovery_bystander.wasm plugins/test_recovery_bystander/
          cp target/wasm32-wasip1/release/test_queue_worker.wasm plugins/test_queue_worker/
          cp target/wasm32-wasip1/release/test_item_writer.wasm plugins/test_item_writer/
          cp target/wasm32-wasip1/release/test_site_queries.wasm plugins/test_site_queries/
          cp target/wasm32-wasip1/release/test_item_deny.wasm plugins/test_item_deny/
          cp target/wasm32-wasip1/release/test_members.wasm plugins/test_members/
          cp target/wasm32-wasip1/release/test_menu_entries.wasm plugins/test_menu_entries/
          cp target/wasm32-wasip1/release/test_page_builder_components.wasm plugins/test_page_builder_components/
          cp target/wasm32-wasip1/release/trovato_record_ref.wasm plugins/trovato_record_ref/
          cp target/wasm32-wasip1/release/trovato_spam.wasm plugins/trovato_spam/
          cp target/wasm32-wasip1/release/trovato_book.wasm plugins/trovato_book/
          cp target/wasm32-wasip1/release/trovato_contact.wasm plugins/trovato_contact/
          cp target/wasm32-wasip1/release/trovato_series.wasm plugins/trovato_series/
          cp target/wasm32-wasip1/release/test_plugin_api.wasm plugins/test_plugin_api/
          cp target/wasm32-wasip1/release/test_assistant_scope.wasm plugins/test_assistant_scope/
          cp target/wasm32-wasip1/release/trovato_ai.wasm plugins/trovato_ai/
          cp target/wasm32-wasip1/release/test_form_taps.wasm plugins/test_form_taps/
          cp target/wasm32-wasip1/release/test_form_taps_b.wasm plugins/test_form_taps_b/
          cp target/wasm32-wasip1/release/test_owned_vocabulary.wasm plugins/test_owned_vocabulary/

      # The same split as the Test job, in one database: the unit tests under
      # nextest, one process each and in parallel; the integration targets
      # under libtest, one target at a time with its tests in parallel (why not
      # nextest for those: see scripts/ci-test-shard.sh). `--test '*'` is every
      # integration target, which is what the plain `cargo llvm-cov
      # --workspace` this replaced ran after the unit tests; neither runs doc
      # tests. `--test-threads=1` is gone with the reason it was there for: the
      # targets' own locks make their tests safe to run together, which a local
      # `cargo test` has always relied on.
      - name: Generate coverage report
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --no-report --workspace --lib --bins
          cargo llvm-cov --no-report --workspace --test '*'
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # PINNED, deliberately. `cargo audit` fetches the advisory database before it
    # scans, so a bare run answered a question that changed under it: not "does
    # this branch have a vulnerable dependency" but "does it have one as of
    # whenever this job happened to start". Every open branch went red the morning
    # an advisory landed against a crate none of them had touched, and the only
    # cure was to rebase and burn another full CI cycle. A red audit had stopped
    # saying anything about the branch it was attached to.
    #
    # This job now audits against the commit recorded in .cargo/advisory-db-pin,
    # with fetching disabled, so a failure here is a real finding about this
    # branch's own dependencies and the same commit audited twice gives the same
    # answer.
    #
    # The live check did not go away and was not weakened:
    # .github/workflows/security-audit.yml fetches live against `main` every day,
    # fails loudly, and files an issue. The pin cannot rot quietly either — the
    # script fails on a pin more than 90 days old. See scripts/security-audit.sh
    # and docs/security-audit.md.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binary; see the sqlx-cli note in the Test job.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # The script checks out the pinned advisory database itself rather than a
      # separate actions/checkout step doing it, so CI and a local run are one code
      # path and there is one place that parses the pin. It also re-checks that the
      # checkout really is at the pin, so a fetch that landed on something else
      # fails loudly instead of auditing against a database nobody recorded.
      - name: Run security audit against the pinned advisory database
        run: ./scripts/security-audit.sh

  semver:
    name: SDK Semver Gate
    runs-on: ubuntu-latest
    # PF-5 / NFR-2 — the frozen-contract breakage guard. The enforceable plugin
    # contract is the SDK crate `trovato-sdk` (its `#[link_name]` host externs,
    # its types, its tap-side support) plus the macros plugins compile against
    # (`trovato-sdk-macros`). This job runs cargo-semver-checks against the crate
    # as it stood on the merge base and FAILS on any SDK-breaking change that is
    # not accompanied by a MAJOR version bump.
    #
    # Bump protocol. The SDK crates no longer carry their own version: they
    # inherit the one project version from [workspace.package], which moves in
    # lock-step with KERNEL_API_VERSION in crates/kernel/src/plugin/mod.rs. What
    # cargo-semver-checks enforces therefore depends on where that version sits:
    #   - ADDITIVE (new pub item; new field on a `#[non_exhaustive]` type):
    #     a MINOR bump suffices. cargo-semver-checks passes.
    #   - BREAKING (removed/renamed/re-typed pub item; new field on a type that is
    #     NOT `#[non_exhaustive]`; new required host import): from 1.0.0 onward
    #     this requires a MAJOR bump and a written justification, and the gate
    #     fails without one.
    #
    # PRE-1.0 CAVEAT, READ THIS. While the project version is 0.x, Cargo's semver
    # rules treat a MINOR bump as sufficient for a breaking change, so this gate
    # will NOT stop an SDK break that bumps one MINOR to the next. The plugin contract is
    # frozen regardless; before 1.0 that freeze is policy, enforced by review
    # rather than by this job. Do not break the SDK. The tooling starts backing
    # the policy again at 1.0.0.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # rustdoc JSON (cargo-semver-checks' input) is nightly-gated; nightly is
      # used ONLY to extract the API surface — the crates still target stable.
      #
      # PINNED, and it must stay pinned. rustdoc's JSON format version is
      # unstable and bumps without notice; cargo-semver-checks only reads the
      # formats a released version knows. A floating `nightly` therefore breaks
      # this job the day rustc bumps the format, on a commit that changed
      # nothing — which is exactly what happened between 2026-07-27 (last green,
      # run 30304475649) and 2026-07-31 (run 30615091502), with
      #   error: unsupported rustdoc format v61 (supported formats are v56, v57, v60)
      # Measured, both directions: nightly-2026-07-27 emits format_version 60,
      # today's nightly emits 61, and the newest released cargo-semver-checks
      # (v0.49.0, 2026-07-18) supports 56/57/60. No tool upgrade fixes it; only
      # the toolchain pin does.
      #
      # UNPIN PROTOCOL: when a cargo-semver-checks release supports the format
      # a newer nightly emits, move this pin forward to a nightly of that era
      # and record the new (toolchain date, format version, tool version) triple
      # here. Verify before pushing with:
      #   cargo +<nightly> rustdoc -p trovato-sdk -Z unstable-options \
      #     --output-format json && jq .format_version target/doc/trovato_sdk.json
      # `cargo-semver-checks` itself is deliberately left floating, so a release
      # that adds the newer format arrives on its own and makes the unpin
      # possible without a second change here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binary; see the sqlx-cli note in the Test job.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check SDK contract stability (fails on an unbumped SDK break)
        env:
          # Override the repo's pinned stable (rust-toolchain.toml) for this step
          # so cargo-semver-checks can emit rustdoc JSON. Pinned; see above.
          RUSTUP_TOOLCHAIN: nightly-2026-07-27
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # No usable event baseline. Fall back to the previous commit, but the
            # root commit has none: on the initial commit of the repository there
            # is no earlier SDK to compare against, so there is nothing this gate
            # can check and it passes rather than erroring on `HEAD~1`.
            if ! BASE="$(git rev-parse --verify --quiet HEAD~1)"; then
              echo "No baseline commit (root commit); nothing to compare. Skipping."
              exit 0
            fi
          fi
          echo "cargo-semver-checks baseline rev: $BASE"
          cargo semver-checks check-release \
            --baseline-rev "$BASE" \
            --package trovato-sdk \
            --package trovato-sdk-macros

  sql-guard:
    name: SQL Custom-Expr Guard
    runs-on: ubuntu-latest
    # PF-5 durable convention (the SQLI-1 class). The gather pipeline renders via
    # `to_string(PostgresQueryBuilder)`, which INLINES any value carried by a bare
    # `Expr::cust(...)` directly into the SQL string. Value-bearing custom SQL MUST
    # therefore use `Expr::cust_with_values(...)` (a bound parameter). This gate
    # ratchets the count of bare `Expr::cust(` sites: a NEW one fails until the
    # author confirms it is value-free (a constant or validated-identifier
    # fragment) and bumps CUST_BASELINE with a one-line justification in the PR.
    # The count is coarse by design — it flags the site for review, it does not
    # classify it. Keep CUST_BASELINE identical here and in pre-commit-check.sh.
    steps:
      - uses: actions/checkout@v5
      - name: No new bare Expr::cust( without justification
        run: |
          CUST_BASELINE=21
          COUNT=$(grep -rn --include='*.rs' 'Expr::cust(' crates/ | wc -l | tr -d ' ')
          echo "bare Expr::cust( call sites: $COUNT (baseline $CUST_BASELINE)"
          if [ "$COUNT" -gt "$CUST_BASELINE" ]; then
            echo "::error::New bare Expr::cust( site(s) detected ($COUNT > $CUST_BASELINE)."
            echo "Value-bearing custom SQL MUST use Expr::cust_with_values (bound params)."
            echo "If the new site is provably value-free, bump CUST_BASELINE in"
            echo ".github/workflows/ci.yml AND scripts/pre-commit-check.sh with a"
            echo "one-line justification in the PR."
            grep -rn --include='*.rs' 'Expr::cust(' crates/
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Build kernel
        run: cargo build -p trovato-kernel --release

      - name: Build plugins
        run: |
          cargo build -p trovato_blog -p trovato_search \
            -p test_e2e_caller -p test_e2e_callee -p test_e2e_bystander -p test_e2e_nocaps \
            -p test_ai_background \
            -p test_queue_worker \
            -p trovato_series -p test_plugin_api \
            -p test_assistant_scope \
            --target wasm32-wasip1 --release

  doc:
    name: Doc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # No shared-key — see the note on the Clippy job for the measurements.
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items

  # The page builder editor: its tests, its types, and that the committed
  # bundle is what its source builds (the kernel serves the bundle from
  # static/, so a source change without a rebuild would never reach a site).
  editor:
    name: Page builder editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/trovato_page_builder/editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/trovato_page_builder/editor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: The committed bundle matches the source
        working-directory: .
        run: |
          git diff --exit-code -- static/js/page-builder-editor.js static/css/page-builder-editor.css || {
            echo "::error::static/js/page-builder-editor.js or static/css/page-builder-editor.css is stale: run 'npm run build' in plugins/trovato_page_builder/editor and commit the result."
            exit 1
          }

  # The kernel's own browser scripts under static/js: their tests run on
  # Node's built-in runner, with no packages to install.
  static-js:
    name: Static JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test static/js/test/*.test.js

  terminology:
    name: Terminology Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for Drupal terminology in Rust sources
        run: |
          # Search for Drupal terms that should use Trovato equivalents
          FOUND=0
          for term in '\bnode\b' '\btaxonomy\b' '\bvocabulary\b' '\bhook_' '\bmodule\b' '\bviews\b'; do
            # Skip false positives: "node" in dependency/URL contexts, "module" in Rust module keyword
            case "$term" in
              '\bnode\b')
                MATCHES=$(grep -rnE "$term" --include='*.rs' crates/ benchmarks/ \
                  | grep -vi 'node_modules\|nodejs\|tree node\|ast node\|xml node\|html node\|mod \|module path\|pub mod\|use ' || true)
                ;;
              '\bmodule\b')
                MATCHES=$(grep -rnE "$term" --include='*.rs' crates/ benchmarks/ \
                  | grep -vi 'mod \|pub mod\|use \|module path\|wasm module\|Module for\|this module\|the module\|route module\|Module::\|\.module\|host module\|engine module\|management module\|Arc<Module\|&Module\|module: \|, module\|module,\|module)\|{ .* module\|compile.*module\|instantiate.*module\|let module\|&module' || true)
                ;;
              '\bviews\b')
                MATCHES=$(grep -rnE "$term" --include='*.rs' crates/ benchmarks/ \
                  | grep -vi 'database views\|sql views\|materialized view' || true)
                ;;
              '\btaxonomy\b'|'\bvocabulary\b')
                # Allow serde aliases for backward-compatible deserialization of existing DB data
                MATCHES=$(grep -rnE "$term" --include='*.rs' crates/ benchmarks/ \
                  | grep -v 'serde(alias' || true)
                ;;
              *)
                MATCHES=$(grep -rnE "$term" --include='*.rs' crates/ benchmarks/ || true)
                ;;
            esac
            if [ -n "$MATCHES" ]; then
              echo "::warning::Found Drupal terminology '$term' in source files:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::warning::Drupal terminology found. See docs/coding-standards.md for Trovato equivalents."
          fi

  # Two kernels behind a round robin proxy (docker-compose.cluster.yml), driven
  # over HTTP by crates/kernel/tests/cluster_test.rs. The test file skips itself
  # unless TROVATO_CLUSTER_URL is set, so the Test shards above run it as a
  # no-op; this is the one job that points it at a cluster. The image is the
  # release Dockerfile, built here from the branch.
  #
  # WHERE ITS TIME GOES. Of 26 minutes on run 45316035626, 18.6 were building
  # the image (8.4 of them recompiling dependencies, 9.3 the kernel crate in
  # release), 4.8 building the test binary after it, and 0.6 the tests. So the
  # dependencies are a cached layer of their own (see "Build the dependency
  # layer"), and the test binary builds while the image does.
  cluster:
    name: Cluster (two nodes)
    runs-on: ubuntu-latest
    # BUDGET: expected time plus half, to catch a hang, not to time a run.
    # Expected 24 minutes: the path a pull request that changes Cargo.lock
    # always takes, since the cached dependency layer is main's and no longer
    # matches (24 in run 45432520463). With the layer, 13 (run 45438628822).
    timeout-minutes: 36
    env:
      TROVATO_CLUSTER_URL: http://localhost:8095
      TROVATO_CLUSTER_DATABASE_URL: postgres://trovato:trovato@localhost:56432/trovato
    steps:
      - uses: actions/checkout@v5
      # Same reclaim as the Test job: a release image build and a debug test
      # build do not both fit in the runner's default free space.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Keyed on the dev profile too; see the Test job.
      - name: Key the cache on the dev profile
        id: profile
        run: echo "hash=$(awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-${{ steps.profile.outputs.hash }}
      # Prebuilt binary; see the sqlx-cli note in the Coverage job.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Started here and waited for after the image build, so the two builds
      # overlap instead of adding up.
      - name: Build the cluster tests (in the background)
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell, on purpose
          nohup sh -c 'cargo nextest run -p trovato-kernel --test cluster_test --no-run; \
            echo $? > "$RUNNER_TEMP/cluster-test-build.rc"' > "$RUNNER_TEMP/cluster-test-build.log" 2>&1 &
      - uses: docker/setup-buildx-action@v3
      # The dependency layer (the Dockerfile's `cook` stage) is the one layer
      # worth caching, and this step, on its own, is what writes it: only that
      # stage goes into the cache. Written on pushes to main alone, which every
      # pull request can read; a pull request writing its own copy would put
      # another gigabyte against the 10 GB the repository's caches share, for
      # each pull request. So a pull request skips this step.
      - name: Build the dependency layer
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cook
          platforms: linux/amd64
          cache-from: type=gha,scope=cluster-cook
          cache-to: type=gha,scope=cluster-cook,mode=max
      # The release Dockerfile, as before, reading the dependency layer from
      # the cache. It names the cache itself: BuildKit reuses imported layers
      # only in a build that asked for them, so the step above leaving the
      # layer in the builder is not enough (run 45425763074 rebuilt all 586
      # crates here). When the dependencies or the base image changed since
      # main last wrote it, nothing matches and the build is the full one it
      # always was.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: trovato-cluster:local
          cache-from: type=gha,scope=cluster-cook
      - name: Start the cluster
        run: docker compose -f docker-compose.cluster.yml up -d --no-build
      - name: Wait for the cluster test build
        run: |
          until [ -f "$RUNNER_TEMP/cluster-test-build.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/cluster-test-build.log"
          exit "$(cat "$RUNNER_TEMP/cluster-test-build.rc")"
      # One process per test under nextest, so the static lock that kept the
      # scenarios apart under libtest no longer can: the `cluster` test group
      # in .config/nextest.toml (max-threads = 1) does it instead. The
      # scenarios share one site and some restart its servers, so they do run
      # one at a time; that is the resource, not a test-runner habit.
      - name: Run the cluster tests
        run: cargo nextest run -p trovato-kernel --test cluster_test --profile ci
      - name: Slow test budget
        run: ./scripts/ci-slow-tests.sh target/nextest/ci/junit.xml
      - name: Kernel logs
        if: failure()
        run: |
          docker compose -f docker-compose.cluster.yml ps -a
          docker compose -f docker-compose.cluster.yml logs --no-color node-a
          docker compose -f docker-compose.cluster.yml logs --no-color node-b
          docker compose -f docker-compose.cluster.yml logs --no-color proxy
      - name: Stop the cluster
        if: always()
        run: docker compose -f docker-compose.cluster.yml down -v

  # Proof of rollback (docs/design/upgrades-and-probes.md §4): the previous
  # binary must start and serve on the schema this change's `trovato migrate`
  # produces, because redeploying the previous image is the whole rollback.
  #
  # "Previous" is the newest release tag that tolerates a newer schema (it
  # contains crates/kernel/src/migrate.rs). Until one is tagged, it is the
  # first parent of the commit under test: the base branch tip for a pull
  # request's merge commit, the previous commit on a push to main.
  rollback:
    name: Rollback (previous binary on this schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trovato
          POSTGRES_PASSWORD: trovato
          POSTGRES_DB: trovato_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://trovato:trovato@localhost:5432/trovato_test
      REDIS_URL: redis://127.0.0.1:6379
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Pick the previous binary
        run: |
          previous=""
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            if git cat-file -e "$tag:crates/kernel/src/migrate.rs" 2>/dev/null; then
              previous="$tag"
              break
            fi
          done
          if [ -z "$previous" ]; then
            previous=$(git rev-parse HEAD^1)
            echo "No release tag tolerates a newer schema yet (none contains crates/kernel/src/migrate.rs)."
            echo "Using the first parent of the commit under test instead: $previous"
          else
            echo "Previous release: $previous"
          fi
          echo "PREVIOUS_REF=$previous" >> "$GITHUB_ENV"
      # Built first and copied out: both builds share target/ (and so the
      # dependency cache), and both write target/debug/trovato.
      - name: Build the previous binary
        run: |
          git worktree add "$RUNNER_TEMP/previous" "$PREVIOUS_REF"
          (cd "$RUNNER_TEMP/previous" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo build -p trovato-kernel --bin trovato)
          cp target/debug/trovato "$RUNNER_TEMP/trovato-previous"
      - name: Previous binary on this branch's schema
        env:
          TROVATO_PREVIOUS_BIN: ${{ runner.temp }}/trovato-previous
          TROVATO_PREVIOUS_ROOT: ${{ runner.temp }}/previous
        run: |
          set -o pipefail
          cargo test -p trovato-kernel --test zero_downtime_test \
            previous_release_serves_on_this_schema -- --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/rollback.log"
          # The test skips itself without TROVATO_PREVIOUS_BIN, and a renamed
          # test matches nothing; either would pass silently. Its last line of
          # evidence must be there.
          grep -q "previous binary: POST /user/login/json -> 200" "$RUNNER_TEMP/rollback.log"

  # The example manifests under deploy/kubernetes/ against the Kubernetes API
  # schemas. kubeconform is one static binary.
  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform-linux-amd64.tar.gz" | sha256sum -c
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
      - name: Validate
        run: '"$RUNNER_TEMP/kubeconform" -strict -summary deploy/kubernetes/'

  changelog:
    name: Changelog Fragment
    runs-on: ubuntu-latest
    # The entry is the part that gets skipped, because it is the only part not
    # needed to make the tests pass. This job fails a pull request that changes
    # crates/, plugins/ or templates/ and adds no file under changelog.d/.
    #
    # The escape hatch is a fragment whose whole body is the single word `none`,
    # not a pull request label: a file travels with the branch, is visible in the
    # diff a reviewer is already reading, needs no token permissions, and works
    # the same from a fork and from a local run of the script.
    #
    # Pull requests only. A push to main has no base to diff against that would
    # mean anything here, and the gate has already run on the pull request.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # The script diffs against the merge base, which needs the history on
          # both sides of it.
          fetch-depth: 0
      - name: Require a changelog fragment for code changes
        run: ./scripts/changelog-check.sh "${{ github.event.pull_request.base.sha }}"
